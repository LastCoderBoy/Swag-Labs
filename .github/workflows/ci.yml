name: Swag Labs Test Suite

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  selenium-tests:
    name: Run Selenium Tests
    runs-on: ubuntu-latest

    steps:

      # ── 1. Check out the repository ──────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up Java 22 ────────────────────────────────────────────────
      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      # ── 3. Set up Chrome ─────────────────────────────────────────────────
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ── 4. Build project ─────────────────────────────────────────────────
      - name: Build project
        run: mvn clean compile -q

      # ── 5. Run all tests (TestNG classes + Cucumber via TestRunner) ────────
      # -Dheadless=true is read by ChromeOptions in BaseTest.
      # Surefire picks up both TestNG test classes AND TestRunner automatically.
      - name: Run Selenium tests (headless)
        run: |
          mvn test \
            -Dheadless=true \
            -Dsurefire.failIfNoSpecifiedTests=false
        env:
          DISPLAY: :99

      # ── 6. Generate Allure report ─────────────────────────────────────────
      - name: Generate Allure report
        if: always()
        run: mvn allure:report -q

      # ── 7. Upload Allure HTML report ──────────────────────────────────────
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 14

      # ── 8. Upload raw Allure results ──────────────────────────────────────
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 14

      # ── 9. Upload Cucumber HTML report ────────────────────────────────────
      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-reports/
          retention-days: 14

      # ── 10. Upload TestNG surefire results ────────────────────────────────
      - name: Upload TestNG results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-results
          path: target/surefire-reports/
          retention-days: 14

      # ── 11. Upload failure screenshots ────────────────────────────────────
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: reports/screenshots/
          retention-days: 7